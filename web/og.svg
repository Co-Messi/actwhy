<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
  <defs>
    <!-- engineering grid -->
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ece9e1" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <!-- hazard stripes for the UNKNOWN rail -->
    <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="14" fill="#ffb020"/>
      <rect x="7" width="7" height="14" fill="#1a1206"/>
    </pattern>
    <!-- diagonal hatch for the SKIPPED rail -->
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="7" fill="#f2554b"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#0a0b0c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#23252a"/>

  <!-- wordmark: status lamp + machined nameplate -->
  <circle cx="88" cy="92" r="7" fill="#35d07a"/>
  <text x="108" y="102" font-size="34" font-weight="700" letter-spacing="4" fill="#ece9e1">ACT<tspan fill="#a5a29a">WHY</tspan></text>
  <text x="1120" y="102" text-anchor="end" font-size="18" letter-spacing="3" fill="#868279">GITHUB ACTIONS TRIGGER EXPLAINER</text>
  <line x1="80" y1="128" x2="1120" y2="128" stroke="#23252a"/>

  <!-- engraved headline -->
  <text x="80" y="212" font-size="52" font-weight="700" fill="#ece9e1" letter-spacing="-1">Know which workflows</text>
  <text x="80" y="272" font-size="52" font-weight="700" letter-spacing="-1" xml:space="preserve"><tspan fill="#35d07a">will fire</tspan><tspan fill="#ece9e1"> — and exactly </tspan><tspan fill="#ece9e1" text-decoration="underline">why</tspan></text>
  <text x="80" y="332" font-size="52" font-weight="700" letter-spacing="-1" xml:space="preserve"><tspan fill="#f2554b">the others won't</tspan><tspan fill="#ece9e1"> — before you push.</tspan></text>

  <!-- verdict rows: solid rail=fires, hatch=skipped, hazard=unknown -->
  <g font-size="24">
    <!-- FIRES -->
    <rect x="80" y="396" width="1040" height="56" fill="#16181b" stroke="#35d07a" stroke-opacity="0.28"/>
    <rect x="80" y="396" width="5" height="56" fill="#35d07a"/>
    <circle cx="116" cy="424" r="12" fill="none" stroke="#35d07a" stroke-width="1.5"/>
    <text x="116" y="431" text-anchor="middle" fill="#35d07a" font-size="14" font-weight="700">✔</text>
    <text x="146" y="432" fill="#ece9e1" font-weight="700">docs.yml</text>
    <rect x="988" y="410" width="112" height="28" fill="none" stroke="#35d07a" stroke-opacity="0.5"/>
    <text x="1044" y="429" text-anchor="middle" fill="#35d07a" font-weight="700" font-size="14" letter-spacing="3">FIRES</text>

    <!-- SKIPPED -->
    <rect x="80" y="460" width="1040" height="56" fill="#0c0d0e" stroke="#23252a"/>
    <rect x="80" y="460" width="5" height="56" fill="url(#hatch)"/>
    <circle cx="116" cy="488" r="12" fill="none" stroke="#f2554b" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="116" y="495" text-anchor="middle" fill="#f2554b" font-size="14" font-weight="700">✘</text>
    <text x="146" y="496" fill="#a5a29a" font-weight="700">ci.yml</text>
    <text x="360" y="496" fill="#868279" font-size="19">all files match paths-ignore</text>
    <rect x="980" y="474" width="120" height="28" fill="none" stroke="#f2554b" stroke-opacity="0.45"/>
    <text x="1040" y="493" text-anchor="middle" fill="#f2554b" font-weight="700" font-size="14" letter-spacing="3">SKIPPED</text>

    <!-- UNKNOWN -->
    <rect x="80" y="524" width="1040" height="56" fill="#101113" stroke="#23252a"/>
    <rect x="80" y="524" width="5" height="56" fill="url(#hazard)"/>
    <circle cx="116" cy="552" r="12" fill="none" stroke="#ffb020" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="116" y="559" text-anchor="middle" fill="#ffb020" font-size="14" font-weight="700">?</text>
    <text x="146" y="560" fill="#ece9e1" font-weight="700">deploy.yml</text>
    <text x="360" y="560" fill="#868279" font-size="19">changed files unknown — won't guess</text>
    <rect x="972" y="538" width="128" height="28" fill="none" stroke="#ffb020" stroke-opacity="0.5"/>
    <text x="1036" y="557" text-anchor="middle" fill="#ffb020" font-weight="700" font-size="14" letter-spacing="3">UNKNOWN</text>
  </g>
</svg>
