name: Bug report
description: Something in actwhy crashed or behaved incorrectly (not a disagreement with GitHub — use "Fidelity report" for that).
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. If actwhy ran fine but its **verdict disagrees with what GitHub
        actually did**, please use the **Fidelity report** template instead — that gets special handling.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did actwhy do instead?
      placeholder: I ran `actwhy` and it crashed with…
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact command you ran, plus a minimal workflow if you can share one.
      placeholder: |
        1. In a repo with this workflow: …
        2. Run: `actwhy push -b feat/login`
        3. See: …
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: actwhy version
      description: Output of `actwhy --version` (or the git commit if running from source).
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: v20.11.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where did this happen?
      options:
        - CLI
        - Web playground
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 15.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: false
